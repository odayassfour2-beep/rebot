<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a">
<title>برنامج الأستاذ عدي عصفور - الجدول المدرسي الذكي</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:Cairo,sans-serif}.tab.active{background:#0369a1;color:white}.modal{background:#0008}.table-wrap{overflow:auto} @media print{.no-print{display:none!important}.print-only{display:block!important}body{background:white}table{width:100%;border-collapse:collapse}th,td{border:1px solid #444;padding:5px;text-align:center}.card{box-shadow:none!important;border:0!important}}.print-only{display:none}</style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
<header class="no-print sticky top-0 z-20 bg-gradient-to-l from-slate-900 to-sky-900 text-white shadow-lg"><div class="mx-auto max-w-7xl px-4 py-4 flex flex-wrap items-center justify-between gap-3"><div><h1 class="text-xl font-extrabold">برنامج الأستاذ عدي عصفور</h1><p class="text-xs text-sky-100">النظام المتكامل لإدارة الجداول والأنصبة المدرسية · <span id="status">الحفظ تلقائي على هذا الجهاز</span></p></div><div class="flex flex-wrap gap-2"><button class="rounded-lg bg-sky-700 px-3 py-2 text-sm" onclick="backup()">تصدير نسخة احتياطية</button><label class="cursor-pointer rounded-lg bg-slate-700 px-3 py-2 text-sm">استيراد نسخة<input type="file" accept=".json" class="hidden" onchange="restore(event)"></label><button class="rounded-lg bg-rose-700 px-3 py-2 text-sm" onclick="resetAll()">إعادة ضبط</button></div></div><nav id="tabs" class="mx-auto flex max-w-7xl gap-2 overflow-x-auto px-4 pb-3"></nav></header>
<main class="mx-auto max-w-7xl space-y-5 px-4 py-6"><div id="app"></div></main><div id="toast" class="fixed bottom-5 left-5 z-50 hidden rounded-xl bg-slate-900 px-4 py-3 text-sm text-white shadow-lg"></div><div id="dialog"></div>
<script>
'use strict';
const DAYS=[['Sunday','الأحد'],['Monday','الاثنين'],['Tuesday','الثلاثاء'],['Wednesday','الأربعاء'],['Thursday','الخميس']],DEFAULT_SUBJECTS=['الرياضيات','اللغة العربية','العلوم','اللغة الإنجليزية','التربية الإسلامية','الاجتماعيات'],DEFAULT_CLASSES=['الأول أ','الأول ب','الأول ج','الثاني أ','الثاني ب','الثاني ج','الثالث أ','الثالث ب','الثالث ج','الرابع أ','الرابع ب'],KEY='odaai_schedule_app_data';
const fresh=()=>({teachers:[],subjects:[...DEFAULT_SUBJECTS],classes:DEFAULT_CLASSES.map((name,i)=>({id:'c'+i,name})),schedule:null,dailyPeriods:6});let state;try{state={...fresh(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state=fresh()}let page='teachers',selectedTeacher='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));document.querySelector('#status').textContent='تم الحفظ تلقائياً'}catch{toast('تعذر الحفظ؛ صدّر نسخة احتياطية لتحافظ على بياناتك')}}
function toast(s){let e=document.querySelector('#toast');e.textContent=s;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),3000)}
const nav=[['teachers','المعلمون والإسناد'],['subjects','المواد'],['classes','الفصول والشعب'],['generator','توليد الجدول'],['master','الجدول العام'],['individual','جدول المعلم']];
function shell(){document.querySelector('#tabs').innerHTML=nav.map(([id,n])=>`<button onclick="go('${id}')" class="tab ${page===id?'active':''} whitespace-nowrap rounded-lg px-3 py-2 text-sm">${n}</button>`).join('');render()}
function go(p){page=p;shell()}
function card(title,body,button=''){return `<section class="card rounded-2xl border border-slate-200 bg-white p-5 shadow-sm"><div class="mb-4 flex flex-wrap items-center justify-between gap-3"><h2 class="text-lg font-bold">${title}</h2>${button}</div>${body}</section>`}
function render(){const root=document.querySelector('#app');if(page==='teachers')root.innerHTML=teachersView();else if(page==='subjects')root.innerHTML=itemsView('المواد الدراسية','subjects');else if(page==='classes')root.innerHTML=itemsView('الفصول والشعب','classes');else if(page==='generator')root.innerHTML=generatorView();else if(page==='master')root.innerHTML=masterView();else root.innerHTML=individualView()}
function teachersView(){let rows=state.teachers.map(t=>`<tr class="border-t"><td class="p-3 font-bold">${esc(t.name)}</td><td class="p-3">${t.quota} حصة</td><td class="p-3">${(t.assignments||[]).map(a=>`${esc(a.subject)} — ${esc(a.className)} (${a.weeklyPeriods})`).join('<br>')}</td><td class="p-3">${(t.offDays||[]).map(d=>DAYS.find(x=>x[0]===d)?.[1]).join('، ')||'—'}</td><td class="p-3"><button class="text-sky-700" onclick="editTeacher('${t.id}')">تعديل</button> · <button class="text-rose-600" onclick="removeTeacher('${t.id}')">حذف</button></td></tr>`).join('');return card('إدارة المعلمين وإسناد الحصص',`<div class="table-wrap"><table class="w-full text-right text-sm"><thead class="bg-slate-100"><tr><th class="p-3">اسم المعلم</th><th class="p-3">النصاب</th><th class="p-3">الإسنادات</th><th class="p-3">أيام الغياب</th><th class="p-3">الإجراءات</th></tr></thead><tbody>${rows||'<tr><td class="p-8 text-center text-slate-500" colspan="5">لا يوجد معلمون بعد.</td></tr>'}</tbody></table></div>`,`<button class="rounded-xl bg-sky-700 px-4 py-2 text-white" onclick="teacherDialog()">إضافة معلم</button>`)}
function itemsView(title,key){let arr=state[key],isClass=key==='classes';return card(title,`<div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">${arr.map(x=>{let name=isClass?x.name:x;return `<div class="flex items-center justify-between rounded-xl border p-4 font-semibold">${esc(name)}<button class="text-rose-600" onclick="removeItem('${key}','${esc(name)}')">حذف</button></div>`}).join('')||'<p class="text-slate-500">لا توجد عناصر.</p>'}</div>`,`<button class="rounded-xl bg-sky-700 px-4 py-2 text-white" onclick="addItem('${key}')">إضافة</button>`)}
function generatorView(){let total=state.teachers.reduce((n,t)=>n+(t.assignments||[]).reduce((a,x)=>a+(+x.weeklyPeriods||0),0),0);return card('توليد الجدول المدرسي الذكي',`<p class="mb-4 text-slate-600">أنشئ جدولاً أسبوعياً مع مراعاة تعارض المعلم والشعبة وأيام غياب المعلمين.</p><label class="mb-4 block font-semibold">عدد الحصص يومياً <select id="periods" class="mr-2 rounded-lg border p-2">${[5,6,7].map(n=>`<option ${state.dailyPeriods===n?'selected':''}>${n}</option>`)}</select></label><div class="mb-5 grid grid-cols-3 gap-3 text-center"><div class="rounded-xl bg-slate-100 p-3">المعلمون<br><b>${state.teachers.length}</b></div><div class="rounded-xl bg-slate-100 p-3">الشعب<br><b>${state.classes.length}</b></div><div class="rounded-xl bg-slate-100 p-3">الحصص المسندة<br><b>${total}</b></div></div><button onclick="generate()" class="rounded-xl bg-sky-700 px-5 py-3 font-bold text-white">بدء التوليد</button>`)}
function masterView(){if(!state.schedule)return card('الجدول العام','<p>لم يتم توليد جدول بعد. انتقل إلى تبويب توليد الجدول.</p>');let html=DAYS.map(([d,n])=>`<section class="mb-5 overflow-hidden rounded-xl border bg-white"><h3 class="bg-slate-900 p-3 font-bold text-white">${n}</h3><div class="table-wrap"><table class="w-full text-center text-xs"><thead><tr><th class="bg-slate-100 p-2">الشعبة</th>${Array.from({length:state.dailyPeriods},(_,i)=>`<th class="bg-slate-100 p-2">الحصة ${i+1}</th>`).join('')}</tr></thead><tbody>${state.classes.map(c=>`<tr><th class="border p-2">${esc(c.name)}</th>${Array.from({length:state.dailyPeriods},(_,i)=>{let x=state.schedule[d]?.[i+1]?.[c.name];return `<td class="border p-2">${x?esc(x.subject)+'<br><small>'+esc(x.teacherName)+'</small>':'—'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div></section>`).join('');return `<div class="no-print mb-3 flex gap-2"><button onclick="print()" class="rounded-lg bg-slate-800 px-4 py-2 text-white">طباعة / PDF</button><button onclick="exportExcel()" class="rounded-lg bg-emerald-700 px-4 py-2 text-white">تصدير Excel</button></div>${html}`}
function individualView(){let sel=state.teachers.find(t=>t.id===selectedTeacher)||state.teachers[0];if(!sel)return card('جدول المعلم الفردي','<p>أضف معلماً لعرض جدوله.</p>');selectedTeacher=sel.id;let rows=DAYS.map(([d,n])=>`<tr><th class="border p-3">${n}</th>${Array.from({length:state.dailyPeriods},(_,i)=>{let found;for(const cls of state.classes){let c=state.schedule?.[d]?.[i+1]?.[cls.name];if(c?.teacherId===sel.id){found=`${c.subject}<br>${cls.name}`;break}}return `<td class="border p-2">${found||'—'}</td>`}).join('')}</tr>`).join('');return card('جدول المعلم الفردي',`<label class="mb-4 block">اختر المعلم <select class="rounded-lg border p-2" onchange="selectedTeacher=this.value;render()">${state.teachers.map(t=>`<option value="${t.id}" ${sel.id===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label><h3 class="mb-3 text-center text-xl font-bold">${esc(sel.name)}</h3><div class="table-wrap"><table class="w-full text-center text-sm"><thead><tr><th class="border p-2">اليوم</th>${Array.from({length:state.dailyPeriods},(_,i)=>`<th class="border p-2">الحصة ${i+1}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div><button onclick="print()" class="no-print mt-4 rounded-lg bg-slate-800 px-4 py-2 text-white">طباعة</button>`)}
function teacherDialog(t){t=t||{};let id=t.id||'';document.querySelector('#dialog').innerHTML=`<div class="modal fixed inset-0 z-40 grid place-items-center p-4"><form class="max-h-[90vh] w-full max-w-xl space-y-3 overflow-auto rounded-2xl bg-white p-5" onsubmit="saveTeacherForm(event,'${id}')"><h2 class="text-xl font-bold">${id?'تعديل المعلم':'إضافة معلم'}</h2><label class="block">الاسم<input id="tn" required class="mt-1 w-full rounded-lg border p-2" value="${esc(t.name||'')}"></label><label class="block">النصاب الأسبوعي<input id="tq" type="number" min="1" max="35" value="${t.quota||15}" class="mt-1 w-full rounded-lg border p-2"></label><p class="font-bold">أيام الغياب</p><div class="flex flex-wrap gap-3">${DAYS.map(([d,n])=>`<label><input type="checkbox" name="off" value="${d}" ${(t.offDays||[]).includes(d)?'checked':''}> ${n}</label>`).join('')}</div><div id="assignments">${(t.assignments?.length?t.assignments:[{subject:state.subjects[0]||'',className:state.classes[0]?.name||'',weeklyPeriods:2}]).map(a=>assignmentRow(a)).join('')}</div><button type="button" class="rounded-lg border px-3 py-2" onclick="document.querySelector('#assignments').insertAdjacentHTML('beforeend',assignmentRow({subject:state.subjects[0]||'',className:state.classes[0]?.name||'',weeklyPeriods:2}))">إضافة إسناد</button><div class="flex justify-end gap-2"><button type="button" class="rounded-lg bg-slate-200 px-4 py-2" onclick="document.querySelector('#dialog').innerHTML=''">إلغاء</button><button class="rounded-lg bg-sky-700 px-4 py-2 text-white">حفظ</button></div></form></div>`}
function assignmentRow(a){return `<div class="my-2 flex gap-2"><select class="asub min-w-0 flex-1 rounded-lg border p-2">${state.subjects.map(s=>`<option ${s===a.subject?'selected':''}>${esc(s)}</option>`).join('')}</select><select class="acls min-w-0 flex-1 rounded-lg border p-2">${state.classes.map(c=>`<option ${c.name===a.className?'selected':''}>${esc(c.name)}</option>`).join('')}</select><input class="aper w-20 rounded-lg border p-2" type="number" min="1" max="10" value="${a.weeklyPeriods||2}"><button type="button" class="text-rose-600" onclick="this.parentElement.remove()">×</button></div>`}
function saveTeacherForm(e,id){e.preventDefault();let t={id:id||'t'+Date.now(),name:document.querySelector('#tn').value.trim(),quota:+document.querySelector('#tq').value||15,offDays:[...document.querySelectorAll('[name=off]:checked')].map(x=>x.value),assignments:[...document.querySelectorAll('#assignments>div')].map(r=>({subject:r.querySelector('.asub').value,className:r.querySelector('.acls').value,weeklyPeriods:+r.querySelector('.aper').value||1}))};let i=state.teachers.findIndex(x=>x.id===id);if(i<0)state.teachers.push(t);else state.teachers[i]=t;save();document.querySelector('#dialog').innerHTML='';shell();toast('تم حفظ بيانات المعلم')}
function editTeacher(id){teacherDialog(state.teachers.find(t=>t.id===id))}function removeTeacher(id){if(confirm('حذف هذا المعلم؟')){state.teachers=state.teachers.filter(t=>t.id!==id);save();render()}}
function addItem(key){let name=prompt(key==='subjects'?'اسم المادة':'اسم الشعبة');if(!name?.trim())return;name=name.trim();if(key==='subjects'){if(!state.subjects.includes(name))state.subjects.push(name)}else if(!state.classes.some(c=>c.name===name))state.classes.push({id:'c'+Date.now(),name});save();render()}
function removeItem(key,name){if(!confirm('حذف '+name+'؟'))return;if(key==='subjects')state.subjects=state.subjects.filter(x=>x!==name);else state.classes=state.classes.filter(x=>x.name!==name);save();render()}
function generate(){state.dailyPeriods=+document.querySelector('#periods').value;let tasks=[];state.teachers.forEach(t=>(t.assignments||[]).forEach(a=>{for(let i=0;i<a.weeklyPeriods;i++)tasks.push({teacherId:t.id,teacherName:t.name,subject:a.subject,className:a.className,offDays:t.offDays||[]})}));tasks.sort(()=>Math.random()-.5);let grid={},busy={};DAYS.forEach(([d])=>{grid[d]={};busy[d]={};for(let p=1;p<=state.dailyPeriods;p++){grid[d][p]={};busy[d][p]=new Set}});let missed=0;for(const t of tasks){let placed=false;for(const [d] of DAYS.filter(([d])=>!t.offDays.includes(d)).sort(()=>Math.random()-.5)){for(let p=1;p<=state.dailyPeriods;p++)if(!grid[d][p][t.className]&&!busy[d][p].has(t.teacherId)){grid[d][p][t.className]={teacherId:t.teacherId,teacherName:t.teacherName,subject:t.subject};busy[d][p].add(t.teacherId);placed=true;break}if(placed)break}if(!placed)missed++}state.schedule=grid;save();go('master');toast(missed?`تم التوليد، وتعذر إسناد ${missed} حصة بسبب القيود`:'تم توليد الجدول وحفظه')}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='odaai-school-backup.json';a.click();URL.revokeObjectURL(a.href)}function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.teachers)||!Array.isArray(x.classes)||!Array.isArray(x.subjects))throw 0;state={...fresh(),...x};save();shell();toast('تم استيراد النسخة الاحتياطية')}catch{toast('ملف النسخة الاحتياطية غير صالح')}};r.readAsText(f);e.target.value=''}function resetAll(){if(confirm('سيتم حذف البيانات المحفوظة من هذا الجهاز. هل تريد المتابعة؟')){state=fresh();save();shell()}}
function exportExcel(){if(!state.schedule)return toast('لا يوجد جدول لتصديره');if(!window.XLSX)return toast('تعذر تحميل أداة Excel؛ تحقق من اتصال الإنترنت');let wb=XLSX.utils.book_new();DAYS.forEach(([d,n])=>{let rows=[['الشعبة',...Array.from({length:state.dailyPeriods},(_,i)=>`الحصة ${i+1}`)],...state.classes.map(c=>[c.name,...Array.from({length:state.dailyPeriods},(_,i)=>{let x=state.schedule[d]?.[i+1]?.[c.name];return x?`${x.subject} (${x.teacherName})`:'-'})])];XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),n)});XLSX.writeFile(wb,'جدول_الأستاذ_عدي_عصفور.xlsx')}
shell();
</script></body></html>
