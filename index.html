<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14382f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مدرسة سنجل">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>إدارة مدرسة سنجل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: blackboard-green header, sticky class chips, scrolling task view, fixed bottom tab bar */
:root{
  --bg:#eaf0ed; --surface:#ffffff; --ink:#15231e; --muted:#5a6a64; --line:#d3dcd8;
  --board:#14382f; --chalk:#f3f7f5; --accent:#e9a824; --accent-ink:#2b1d00;
  --ok:#1f8a5b; --ok-bg:#dcf2e7; --bad:#c93a30; --bad-bg:#fbe3e0; --warn-bg:#fdf1d3;
  --l1:#2a9d8f; --l1t:#ffffff; --l2:#f2c230; --l2t:#3a2c00; --l3:#f08a24; --l3t:#2d1600;
  --l4:#e0453a; --l4t:#ffffff; --l5:#a3162a; --l5t:#ffffff; --l6:#3a1146; --l6t:#ffffff;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1513; --surface:#16211e; --ink:#e7efec; --muted:#93a59e; --line:#27363f;
  --board:#0a241d; --chalk:#eef5f2; --ok-bg:#12372a; --bad-bg:#43211f; --warn-bg:#3b3012; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1513; --surface:#16211e; --ink:#e7efec; --muted:#93a59e; --line:#27363f;
  --board:#0a241d; --chalk:#eef5f2; --ok-bg:#12372a; --bad-bg:#43211f; --warn-bg:#3b3012; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));
  padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:820px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
header{background:var(--board);color:var(--chalk);padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:14px}
header .wrap{display:flex;align-items:center;gap:14px}
.crest{flex:none;width:46px;height:46px;border-radius:12px;border:2px solid var(--accent);display:grid;place-items:center;font:700 22px var(--f-display);color:var(--accent)}
header h1{margin:0;font:700 20px/1.25 var(--f-display);text-wrap:balance}
header p{margin:2px 0 0;font-size:13px;opacity:.82}
#sync{margin-inline-start:auto;font-size:12px;opacity:.9;text-align:left;white-space:nowrap}
.chipsbar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px}
#chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chip{flex:1 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;cursor:pointer;font-weight:600;display:flex;gap:8px;align-items:center;justify-content:center}
.chip small{font-weight:500;color:var(--muted);font-size:12px}
.chip.on{background:var(--board);color:var(--chalk);border-color:var(--board)}
.chip.on small{color:var(--accent)}
main{padding-block:16px;display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.bar{display:grid;gap:10px}
.dt{display:flex;align-items:center;gap:10px;font-weight:600}
input[type=text],input[type=tel],input[type=date],input[type=url],select,textarea{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;min-width:0}
.dt input{width:auto}
textarea{resize:vertical;min-height:70px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{border-radius:999px;padding:3px 12px;font-size:13px;font-weight:600}
.pill.p{background:var(--ok-bg);color:var(--ok)} .pill.a{background:var(--bad-bg);color:var(--bad)} .pill.n{background:var(--line);color:var(--muted)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--board)}
.btn.main{background:var(--board);color:var(--chalk);border-color:var(--board)}
.btn.warn{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.stu{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-inline-start:5px solid var(--line)}
.stu.abs{border-inline-start-color:var(--bad);background:linear-gradient(var(--bad-bg),var(--bad-bg)) ,var(--surface);background-blend-mode:normal}
.stu.pre{border-inline-start-color:var(--ok)}
.who{flex:1 1 180px;min-width:0}
.who b{display:block;overflow-wrap:anywhere}
.who small{color:var(--muted);overflow-wrap:anywhere}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 16px;cursor:pointer;font-weight:600;min-width:64px}
.seg button.on.p{background:var(--ok);color:#fff} .seg button.on.a{background:var(--bad);color:#fff}
.ico{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;cursor:pointer;font-size:17px}
.sent{font-size:12px;color:var(--ok);font-weight:600}
.ladder{display:flex;gap:6px;flex-wrap:wrap}
.ladder span,.badge{background:var(--lc);color:var(--lct);border-radius:8px;padding:2px 9px;font-size:12px;font-weight:700;border:1px solid rgb(0 0 0 / .12)}
.dots{display:flex;gap:4px}
.dots i{width:14px;height:14px;border-radius:4px;background:var(--lc);border:1px solid rgb(0 0 0 / .15)}
.hist{flex-basis:100%;display:grid;gap:6px;padding-top:6px;border-top:1px dashed var(--line)}
.hist div{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;font-size:13px}
.hist div span{flex:1 1 160px;min-width:0;overflow-wrap:anywhere}
.l1{--lc:var(--l1);--lct:var(--l1t)} .l2{--lc:var(--l2);--lct:var(--l2t)} .l3{--lc:var(--l3);--lct:var(--l3t)}
.l4{--lc:var(--l4);--lct:var(--l4t)} .l5{--lc:var(--l5);--lct:var(--l5t)} .l6{--lc:var(--l6);--lct:var(--l6t)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
label.f{display:grid;gap:4px;font-weight:600;font-size:13px}
h2{margin:0;font:700 17px var(--f-display)}
.hint{color:var(--muted);font-size:13px;margin:0}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.msg{white-space:pre-wrap;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px;font-size:14px}
.sw{display:flex;align-items:center;gap:10px;font-weight:600}
.sw input{width:20px;height:20px;accent-color:var(--board)}
nav.tabs{position:fixed;inset:auto 0 0 0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:8;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{display:flex;width:100%;max-width:820px}
.tab{flex:1;border:0;background:none;padding:10px 4px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted);border-top:3px solid transparent}
.tab.on{color:var(--board);border-top-color:var(--accent)}
@media (prefers-color-scheme:dark){.tab.on{color:var(--accent)}}
#toast{position:fixed;inset:auto 16px calc(88px + env(safe-area-inset-bottom,0px)) 16px;margin-inline:auto;max-width:520px;background:var(--board);color:var(--chalk);border-radius:12px;padding:10px 14px;z-index:60;display:none;gap:10px;align-items:center;box-shadow:0 6px 24px rgb(0 0 0 / .3)}
#toast.on{display:flex} #toast button{margin-inline-start:auto;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:5px 12px;font-weight:700;cursor:pointer}
#modal{position:fixed;inset:0;z-index:40;display:none;background:rgb(0 0 0 / .55);padding:16px;overflow:auto}
#modal.on{display:grid;place-items:center}
.sheet{background:var(--surface);border-radius:16px;max-width:560px;width:100%;padding:18px;display:grid;gap:12px;border-top:8px solid var(--lc,var(--board))}
.sheet h3{margin:0;font:700 18px var(--f-display)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.tblw table{border-collapse:collapse;font-size:13px;width:100%}
.tblw th,.tblw td{padding:5px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.tblw th{background:var(--bg);color:var(--muted)}
/* effects */
.fx{position:fixed;inset:0;z-index:50;display:grid;place-items:center;pointer-events:none;opacity:0}
.fx.on{opacity:1}
.fx::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,var(--lc),transparent 74%);opacity:0}
.fx.on::before{animation:flash .55s ease-out var(--rep,1)}
.fx .big{position:relative;background:var(--lc);color:var(--lct);font:700 clamp(22px,7vw,40px)/1.3 var(--f-display);padding:14px 26px;border-radius:18px;text-align:center;box-shadow:0 10px 40px rgb(0 0 0 / .45);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.fx .big small{display:block;font:500 15px var(--f-body);opacity:.9}
.rings i{position:absolute;left:50%;top:45%;width:24vmin;height:24vmin;border:5px solid var(--lc);border-radius:50%;translate:-50% -50%;opacity:0}
.fx.on .rings i{animation:ring 1s ease-out var(--rep,1)}
.fx.on .rings i:nth-child(2){animation-delay:.18s} .fx.on .rings i:nth-child(3){animation-delay:.36s}
.shake{animation:shake .5s}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes ring{0%{transform:scale(.3);opacity:.9}100%{transform:scale(4.5);opacity:0}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.shake,.fx .big,.fx.on .rings i{animation:none}.fx.on::before{animation-duration:.3s;animation-iteration-count:1}}
@media print{
  body>*:not(#modal){display:none!important}
  #modal{position:static;background:none;display:block!important;padding:0}
  .sheet{border:0;max-width:none;color:#000;background:#fff}
  .noprint{display:none!important}
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="crest" aria-hidden="true">س</div>
    <div>
      <h1>مدرسة ذكور سنجل الأساسية العليا</h1>
      <p>بإشراف المعلم عدي عصفور</p>
    </div>
    <div id="sync" aria-live="polite"></div>
  </div>
</header>
<div class="chipsbar"><div class="wrap"><div id="chips" role="tablist" aria-label="الصفوف"></div></div></div>
<main class="wrap"><div id="view"></div></main>
<nav class="tabs" aria-label="التبويبات"><div class="in">
  <button class="tab" data-act="tab" data-v="att">الحضور</button>
  <button class="tab" data-act="tab" data-v="vio">السلوك</button>
  <button class="tab" data-act="tab" data-v="stu">الطلاب</button>
  <button class="tab" data-act="tab" data-v="log">السجل</button>
  <button class="tab" data-act="tab" data-v="set">الإعدادات</button>
</div></nav>
<div id="fx" class="fx" aria-hidden="true"></div>
<div id="toast" role="status"></div>
<div id="modal" role="dialog" aria-modal="true"></div>

<script>
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const todayISO=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const fmtDate=iso=>{try{return new Date(iso+'T12:00:00').toLocaleDateString('ar-u-nu-latn',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}catch(e){return iso}};
const CLASSES=['السادس أ','السادس ب','الخامس أ','الخامس ب'];
const SCHOOL='مدرسة ذكور سنجل الأساسية العليا';
const ORD=['الأولى','الثانية','الثالثة','الرابعة','الخامسة','السادسة'];
const LEVELS=[
 {name:'إشعار وحفظ',act:'تُحفظ كإشعار فقط دون إرسال رسالة.',tpl:null},
 {name:'إبلاغ ولي الأمر',act:'إرسال رسالة لولي الأمر لإبلاغه بالمخالفة.',tpl:'v2'},
 {name:'استدعاء وتعهد',act:'إرسال رسالة لحضور ولي الأمر إلى المدرسة وتوقيع تعهد.',tpl:'v3'},
 {name:'إنذار أول',act:'إرسال إنذار أول لولي الأمر.',tpl:'v4'},
 {name:'إنذار نهائي',act:'إرسال إنذار نهائي لولي الأمر.',tpl:'v5'},
 {name:'فصل الطالب',act:'إشعار ولي الأمر بقرار فصل الطالب.',tpl:'v6'}
];
const VTYPES=['التأخر الصباحي','عدم إحضار الكتب أو الدفاتر','الإزعاج داخل الصف','عدم ارتداء الزي المدرسي','الاعتداء على زميل','إساءة لمعلم','إتلاف ممتلكات المدرسة','الهروب من الحصة','استخدام الهاتف في المدرسة','أخرى'];
const DEF_TPL={
 absent:'السلام عليكم، ولي أمر الطالب {student} ({class}) المحترم،\nنعلمكم بغياب ابنكم عن المدرسة اليوم {date}. نرجو إفادتنا بسبب الغياب.\n{school}',
 v2:'ولي أمر الطالب {student} ({class}) المحترم،\nنبلغكم بأن ابنكم ارتكب مخالفة سلوكية ({violation}) بتاريخ {date}، وهي المخالفة الثانية. نأمل متابعته وتوجيهه.\n{school}',
 v3:'ولي أمر الطالب {student} ({class}) المحترم،\nتكرر من ابنكم سلوك غير مقبول ({violation}) بتاريخ {date}، وهي المخالفة الثالثة. نرجو حضوركم إلى المدرسة لمقابلة الإدارة وتوقيع تعهد خطي بعدم التكرار.\n{school}',
 v4:'ولي أمر الطالب {student} ({class}) المحترم،\nنوجه إليكم الإنذار الأول بسبب تكرار المخالفات السلوكية، وآخرها ({violation}) بتاريخ {date}. تكرارها سيعرض الطالب لإنذار نهائي.\n{school}',
 v5:'ولي أمر الطالب {student} ({class}) المحترم،\nنوجه إليكم الإنذار النهائي بسبب استمرار المخالفات، وآخرها ({violation}) بتاريخ {date}. أي مخالفة أخرى ستؤدي إلى فصل الطالب.\n{school}',
 v6:'ولي أمر الطالب {student} ({class}) المحترم،\nنظرا لتكرار المخالفات رغم الإنذارات، وآخرها ({violation}) بتاريخ {date}، تقرر فصل الطالب. نرجو مراجعة إدارة المدرسة.\n{school}'
};
const TPL_LABELS={absent:'رسالة الغياب',v2:'المخالفة الثانية: إبلاغ',v3:'المخالفة الثالثة: استدعاء وتعهد',v4:'المخالفة الرابعة: إنذار أول',v5:'المخالفة الخامسة: إنذار نهائي',v6:'المخالفة السادسة: فصل'};
const KEY='sanjil_school_v1';
const defSet=()=>({sheetUrl:'',autoSync:true,mode:'sms',webhookUrl:'',cc:'970',autoSend:true,sound:true,tpl:{...DEF_TPL}});
function seed(){
  const names=[['يوسف خالد','أبو يوسف'],['محمود سامر','أبو محمود'],['عمر ناصر','أبو عمر'],['كريم وليد','أبو كريم'],['ليث رائد','أبو ليث'],['بسام هاني','أبو بسام'],['آدم فادي','أبو آدم'],['سليم نبيل','أبو سليم']];
  return {students:names.map((n,i)=>({id:uid(),cls:CLASSES[Math.floor(i/2)],name:n[0],parent:n[1],phone:'059900000'+(i+1),note:'مثال، عدّله أو احذفه'})),attendance:{},violations:[],messages:[],settings:defSet()};
}
function load(){
  try{const r=JSON.parse(localStorage.getItem(KEY)||'null');
    if(r&&r.students){r.settings={...defSet(),...(r.settings||{})};r.settings.tpl={...DEF_TPL,...(r.settings.tpl||{})};r.attendance=r.attendance||{};r.violations=r.violations||[];r.messages=r.messages||[];return r}}catch(e){}
  return seed();
}
let D=load(); const S=()=>D.settings;
const ui={cls:CLASSES[0],tab:'att',date:todayISO(),vs:'',open:{},del:'',syncMsg:'',queue:null};
let syncTimer=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){} queueSync()}

/* ---------- helpers ---------- */
const stu=()=>D.students.filter(s=>s.cls===ui.cls);
const byId=id=>D.students.find(s=>s.id===id);
const vlist=sid=>D.violations.filter(v=>v.sid===sid).sort((a,b)=>a.date.localeCompare(b.date)||a.ts-b.ts);
const lvlOf=(sid,vid)=>Math.min(6,vlist(sid).findIndex(v=>v.id===vid)+1);
const curLvl=sid=>Math.min(6,vlist(sid).length);
const fill=(t,c)=>t.replace(/\{(\w+)\}/g,(m,k)=>c[k]??m);
function buildMsg(sid,kind,x={}){
  const s=byId(sid);if(!s)return '';
  const c={student:s.name,parent:s.parent||'',class:s.cls,date:fmtDate(x.date||ui.date),violation:x.type||'',school:SCHOOL};
  return fill(S().tpl[kind]||DEF_TPL[kind]||'',c);
}
const intl=p=>{let d=String(p).replace(/[^\d+]/g,'');if(d.startsWith('+'))return d.slice(1);if(d.startsWith('00'))return d.slice(2);if(d.startsWith('0'))return S().cc+d.slice(1);return d};
function toast(msg,label,fn){
  const t=$('#toast');t.innerHTML='<span></span>'+(label?'<button type="button">'+esc(label)+'</button>':'');
  t.firstChild.textContent=msg;t.classList.add('on');
  if(label)t.querySelector('button').onclick=()=>{t.classList.remove('on');fn&&fn()};
  clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),label?7000:3500);
}
function openModal(html){const m=$('#modal');m.innerHTML=html;m.classList.add('on')}
function closeModal(){ui.imp=null;$('#modal').classList.remove('on');$('#modal').innerHTML=''}

/* ---------- sound & effects ---------- */
let ac;
function tone(f,t,d,type='sine',g=.2,f2){
  const n=ac.currentTime+t,o=ac.createOscillator(),gn=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.linearRampToValueAtTime(f2,n+d);
  gn.gain.setValueAtTime(0.0001,n);gn.gain.linearRampToValueAtTime(g,n+.02);gn.gain.exponentialRampToValueAtTime(.001,n+d);
  o.connect(gn);gn.connect(ac.destination);o.start(n);o.stop(n+d+.05);
}
function sound(k){
  if(!S().sound)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();
    if(k==='present')tone(880,0,.09,'sine',.08);
    else if(k==='absent'){tone(520,0,.18);tone(380,.2,.32)}
    else if(k===1)tone(660,0,.4,'sine',.2);
    else if(k===2){tone(700,0,.2,'triangle');tone(700,.26,.2,'triangle')}
    else if(k===3){tone(520,0,.2,'triangle');tone(660,.22,.2,'triangle');tone(820,.44,.3,'triangle')}

    if(!S().webhookUrl){toast('أدخل رابط بوابة الإرسال في الإعدادات');return false}
    try{await fetch(S().webhookUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({to:phone,message:msg,...meta})});return true}
    catch(e){toast('تعذر الاتصال ببوابة الإرسال');return false}

const D09=s=>String(s).replace(/[٠-٩]/g,c=>c.charCodeAt(0)-0x660).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-0x6F0);
const normName=s=>D09(s??'').replace(/[ً-ٰٟـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ').trim().toLowerCase();
function normClass(s){
  const n=normName(s).replace(/\s+/g,'');if(!n)return '';
  const hit=CLASSES.find(c=>normName(c).replace(/\s+/g,'')===n);if(hit)return hit;
  const g=/6|سادس/.test(n)?'السادس':/5|خامس/.test(n)?'الخامس':'';
  const l=n.slice(-1),sec=(l==='ا'||l==='a')?'أ':(l==='ب'||l==='b')?'ب':'';
  const c=g&&sec?g+' '+sec:'';return CLASSES.includes(c)?c:'';
}
function normPhone(s){
  let d=D09(s??'').replace(/[^\d+]/g,'');if(!d)return '';
  d=d.replace(/^\+/,'').replace(/^00/,'');
  if(/^(970|972)\d{9}$/.test(d))d='0'+d.slice(3);
  else if(d.length===9&&d[0]==='5')d='0'+d;
  return d;
}
const fmtD=(y,m,d)=>(+m>=1&&+m<=12&&+d>=1&&+d<=31)?y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'):'';
function isoOf(d){const x=new Date(d.getTime()+43200000);return fmtD(x.getFullYear(),x.getMonth()+1,x.getDate())}
function parseDate(v){
  if(v instanceof Date)return isoOf(v);
  if(typeof v==='number'&&v>20000&&v<80000)return isoOf(new Date(Math.round((v-25569)*864e5)));
  const s=D09(v??'').trim();let m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  if(m)return fmtD(m[1],m[2],m[3]);
  m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);
  if(m){let y=+m[3];if(y<100)y+=2000;return fmtD(y,m[2],m[1])}
  return '';
}
function cellText(v){if(v instanceof Date)return isoOf(v);if(typeof v==='number')return String(v);return String(v??'').trim()}
function parseStatus(x){
  const n=normName(x);
  if(['غائب','غايب','غياب','غ','absent','a','x','0'].includes(n))return 'A';
  if(['حاضر','حضور','ح','present','p','1'].includes(n))return 'P';
  return '';
}
function autoMap(mode,headers){
  const H=headers.map(normName),M={},used=new Set();
  FIELDS[mode].forEach(([f])=>M[f]=-1);
  FIELDS[mode].forEach(([f])=>{const i=H.findIndex((h,k)=>!used.has(k)&&SYN[f].some(x=>normName(x)===h));if(i>=0){M[f]=i;used.add(i)}});
  FIELDS[mode].forEach(([f])=>{if(M[f]>=0)return;const i=H.findIndex((h,k)=>h&&!used.has(k)&&SYN[f].some(x=>h.includes(normName(x))));if(i>=0){M[f]=i;used.add(i)}});
  return M;
}
function pickSheet(I){
  const names=I.wb.SheetNames;
  const kw={students:['طلاب','طالب','اسماء','students'],violations:['مخالف','سلوك','violation'],attendance:['حضور','غياب','attendance']}[I.mode];
  const hit=names.find(n=>kw.some(k=>normName(n).includes(normName(k))));
  if(hit)return hit;
  if(I.mode==='students'&&names.filter(n=>normClass(n)).length>=2)return '*';
  return names[0];
}
function setupImp(){
  const I=ui.imp,X=window.XLSX;
  const picks=I.sheet==='*'?I.wb.SheetNames.filter(n=>normClass(n)):[I.sheet];
  I.headers=[];I.body=[];
  picks.forEach((n,k)=>{
    const aoa=X.utils.sheet_to_json(I.wb.Sheets[n],{header:1,raw:true,cellDates:true,defval:''});
    if(!aoa.length)return;
    if(!k)I.headers=aoa[0].map(cellText);
    const sc=I.sheet==='*'?normClass(n):null;
    aoa.slice(1).forEach(r=>{if(r.some(v=>cellText(v)!==''))I.body.push({c:r,sc})});
  });
  I.map=autoMap(I.mode,I.headers);
}
function findStu(name,cls){
  const n=normName(name);let c=D.students.filter(s=>normName(s.name)===n);
  if(cls)c=c.filter(s=>s.cls===cls);
  return c.find(s=>s.cls===ui.cls)||c[0]||null;
}
function planImport(){
  const I=ui.imp,M=I.map,out={ok:[],bad:[],dup:0,upd:0},seen=new Set();
  const get=(r,f)=>M[f]>=0?cellText(r.c[M[f]]):'';
  I.body.forEach((r,i)=>{
    const row='سطر '+(i+2)+': ';
    const name=get(r,'name');if(!name)return;
    if(I.mode==='students'){
      const raw=get(r,'cls');
      const cls=raw?normClass(raw):(r.sc||I.cls);
      if(!cls){out.bad.push(row+'صف غير معروف ('+raw+')');return}
      const key=cls+'|'+normName(name);if(seen.has(key)){out.dup++;return}seen.add(key);
      const f={name,parent:get(r,'parent'),phone:normPhone(get(r,'phone')),note:get(r,'note')};
      const ex=D.students.find(s=>s.cls===cls&&normName(s.name)===normName(name));
      if(ex){if(I.upd){out.ok.push({upd:ex,f});out.upd++}else out.dup++}else out.ok.push({cls,f});
      return;
    }
    const cl=M.cls>=0?normClass(get(r,'cls')):'';
    const s=findStu(name,cl||r.sc);
    if(!s){out.bad.push(row+'طالب غير موجود ('+name+')');return}
    if(I.mode==='violations'){
      const type=get(r,'type')||'أخرى',date=(M.date>=0&&parseDate(r.c[M.date]))||todayISO();
      const key=s.id+'|'+date+'|'+normName(type);
      if(seen.has(key)||D.violations.some(v=>v.sid===s.id&&v.date===date&&normName(v.type)===normName(type))){out.dup++;return}
      seen.add(key);out.ok.push({sid:s.id,type,date,note:get(r,'note')});
    }else{
      const date=M.date>=0?parseDate(r.c[M.date]):'';
      if(!date){out.bad.push(row+'تاريخ غير صالح ('+name+')');return}
      const st=parseStatus(get(r,'status'));
      if(!st){out.bad.push(row+'حالة غير مفهومة ('+get(r,'status')+')');return}
      out.ok.push({sid:s.id,date,st});
    }
  });
  return out;
}

    <div class="btns"><button class="btn" data-act="allP">الكل حاضر</button><button class="btn warn" data-act="absQueue">إرسال SMS للغائبين</button></div>
  </section>`+(list.length?`<ul class="list">${list.map(s=>{const st=day[s.id];
    return `<li class="stu ${st==='A'?'abs':st==='P'?'pre':''}"><div class="who"><b>${esc(s.name)}</b><small>${esc(s.parent||'ولي الأمر غير مسجل')} · ${esc(s.phone||'بلا رقم')}</small></div>
    ${st==='A'&&wasSent(s.id,'absent',ui.date)?'<span class="sent">أُرسلت الرسالة</span>':''}
    ${st==='A'?`<button class="ico" title="إعادة إرسال رسالة الغياب" aria-label="إعادة إرسال" data-act="resend" data-id="${s.id}">↻</button>`:''}
    <div class="seg"><button class="${st==='P'?'on p':''}" data-act="setAtt" data-id="${s.id}" data-v="P">حاضر</button><button class="${st==='A'?'on a':''}" data-act="setAtt" data-id="${s.id}" data-v="A">غائب</button></div></li>`}).join('')}</ul>`:empty('لا يوجد طلاب في هذا الصف. أضفهم من تبويب الطلاب.'));
 },
 vio(){
  const list=stu();
  if(!list.length)return empty('لا يوجد طلاب في هذا الصف. أضفهم من تبويب الطلاب.');
  if(!list.some(s=>s.id===ui.vs))ui.vs=list[0].id;
  const ladder=LEVELS.map((l,i)=>`<span class="l${i+1}">${i+1}. ${l.name}</span>`).join('');
  return `<section class="card bar"><h2>تسجيل مخالفة</h2>
   <div class="ladder" aria-label="سلم المخالفات">${ladder}</div>
   <div class="grid2"><label class="f">الطالب<select id="vS" data-bind="vs">${list.map(s=>`<option value="${s.id}" ${s.id===ui.vs?'selected':''}>${esc(s.name)} (${vlist(s.id).length})</option>`).join('')}</select></label>
   <label class="f">نوع المخالفة<select id="vT">${VTYPES.map(t=>`<option>${t}</option>`).join('')}</select></label></div>
   <div class="grid2"><label class="f">التاريخ<input type="date" id="vD" value="${todayISO()}"></label>
   <label class="f">وصف المخالفة (اختياري)<input type="text" id="vO" placeholder="إذا اخترت أخرى اكتب نوعها"></label></div>
   <label class="f">ملاحظة عن المخالفة<textarea id="vN" placeholder="ماذا حدث، وأي إجراء اتُّخذ في الصف"></textarea></label>
   <div class="btns"><button class="btn main" data-act="addVio">تسجيل المخالفة</button><button class="btn warn" data-act="vioQueue">إرسال رسالة للمخالفين</button></div></section>
   <ul class="list">${list.map(s=>{const h=vlist(s.id),n=Math.min(6,h.length),open=ui.open[s.id];
    return `<li class="stu ${n?'l'+n:''}" ${n?'style="border-inline-start-color:var(--lc)"':''}><div class="who"><b>${esc(s.name)}</b><small>${n?'آخر إجراء: '+LEVELS[n-1].name:'لا توجد مخالفات'}</small></div>
    <div class="dots">${h.slice(0,12).map((v,i)=>`<i class="l${Math.min(6,i+1)}" title="${esc(v.type)}"></i>`).join('')}</div>
    ${n?`<span class="badge l${n}">${h.length}</span><button class="btn sm" data-act="toggle" data-id="${s.id}">${open?'إخفاء':'السجل'}</button>`:''}
    ${open?`<div class="hist">${h.map((v,i)=>`<div><span class="badge l${Math.min(6,i+1)}">${ORD[Math.min(5,i)]}</span><span><b>${esc(v.type)}</b> · ${esc(v.date)}${v.note?'<br>'+esc(v.note):''}</span>${ui.del===v.id?`<button class="btn sm danger" data-act="delVio" data-id="${v.id}">تأكيد الحذف</button>`:`<button class="btn sm" data-act="askDel" data-id="${v.id}">حذف</button>`}</div>`).join('')}</div>`:''}</li>`}).join('')}</ul>`;
 },
 stu(){
  const list=stu(),hasEx=D.students.some(s=>(s.note||'').startsWith('مثال'));
  return `<section class="card bar"><h2>إضافة طالب إلى ${esc(ui.cls)}</h2>
   <div class="grid2"><label class="f">اسم الطالب<input type="text" id="nN" autocomplete="off"></label><label class="f">اسم ولي الأمر<input type="text" id="nP" autocomplete="off"></label>
   <label class="f">رقم هاتف ولي الأمر<input type="tel" id="nT" inputmode="tel" placeholder="05XXXXXXXX"></label><label class="f">ملاحظة<input type="text" id="nO"></label></div>
   <div class="btns"><button class="btn main" data-act="addStu">إضافة الطالب</button>${hasEx?'<button class="btn" data-act="rmEx">حذف الطلاب الأمثلة</button>':''}</div></section>`+impCard+
   (list.length?`<ul class="list">${list.map(s=>`<li class="stu"><div class="who"><b>${esc(s.name)}</b><small>${esc(s.parent||'—')} · ${esc(s.phone||'بلا رقم')}${s.note?' · '+esc(s.note):''}</small></div>
    <button class="btn sm" data-act="editStu" data-id="${s.id}">تعديل</button>
    ${ui.del===s.id?`<button class="btn sm danger" data-act="delStu" data-id="${s.id}">تأكيد الحذف</button>`:`<button class="btn sm" data-act="askDel" data-id="${s.id}">حذف</button>`}</li>`).join('')}</ul>`:empty('لا يوجد طلاب في هذا الصف بعد.'));
 },
 log(){
  const m=[...D.messages].reverse().slice(0,60);
  const td=D.violations.filter(v=>v.date===todayISO()).length;
  return `<section class="card bar"><h2>سجل الرسائل</h2><p class="hint">مخالفات اليوم: ${td} · إجمالي الرسائل المسجلة: ${D.messages.length}</p></section>`+
   (m.length?`<ul class="list">${m.map(x=>`<li class="stu ${x.ok?'pre':'abs'}"><div class="who"><b>${esc(x.name)} <small>(${esc(x.cls)})</small></b><small>${esc(TPL_LABELS[x.kind]||x.kind)} · ${new Date(x.ts).toLocaleString('ar-u-nu-latn')} · ${x.mode==='sms'?'رسالة SMS':x.mode==='wa'?'واتساب':'بوابة'}</small></div><span class="${x.ok?'sent':'pill a'}">${x.ok?'تم':'فشل'}</span></li>`).join('')}</ul>`:empty('لم تُرسل أي رسالة بعد.'));
 },
 set(){
  const s=S(),chk=(k,l)=>`<label class="sw"><input type="checkbox" data-bind="${k}" ${s[k]?'checked':''}>${l}</label>`;
  return `<section class="card bar"><h2>آلية الإرسال المعتمدة</h2>
   <label class="f">طريقة الإرسال<select data-bind="mode"><option value="sms" ${s.mode==='sms'?'selected':''}>تطبيق الرسائل في الجهاز (SMS)</option><option value="wa" ${s.mode==='wa'?'selected':''}>واتساب</option><option value="webhook" ${s.mode==='webhook'?'selected':''}>بوابة إرسال تلقائية (رابط)</option></select></label>
   ${s.mode==='webhook'?`<label class="f">رابط البوابة<input type="url" dir="ltr" data-bind="webhookUrl" value="${esc(s.webhookUrl)}" placeholder="https://..."></label><p class="hint">يُرسل البرنامج لكل رسالة طلب POST بصيغة JSON فيه to و message و kind و student و class.</p>`:''}
   <label class="f">مفتاح الدولة لأرقام واتساب<input type="text" dir="ltr" data-bind="cc" value="${esc(s.cc)}"></label>
   ${chk('autoSend','إرسال الرسالة تلقائيا عند تسجيل الغياب أو المخالفة')}${chk('sound','تشغيل المؤثرات الصوتية')}
   <p class="hint">الطريقة المختارة تُحفظ على هذا الجهاز وتُستخدم في كل الرسائل.</p></section>
   <section class="card bar"><h2>ربط جوجل شيت</h2>
   <label class="f">رابط تطبيق الويب (Apps Script)<input type="url" dir="ltr" data-bind="sheetUrl" value="${esc(s.sheetUrl)}" placeholder="https://script.google.com/macros/s/.../exec"></label>
   ${chk('autoSync','مزامنة تلقائية بعد كل تعديل')}
   <div class="btns"><button class="btn main" data-act="syncNow">مزامنة الآن</button><button class="btn" data-act="pull">جلب من الشيت</button></div>
   <p class="hint">${esc(ui.syncMsg||'ثبّت ملف Code.gs في جوجل شيت ثم الصق رابط النشر هنا.')}</p></section>
   <section class="card bar"><h2>نصوص الرسائل</h2><p class="hint">المتغيرات: {student} {parent} {class} {date} {violation} {school}</p>
   ${Object.keys(DEF_TPL).map(k=>`<label class="f">${TPL_LABELS[k]}<textarea data-bind="tpl:${k}">${esc(s.tpl[k])}</textarea></label>`).join('')}
   <button class="btn sm" data-act="resetTpl">استعادة النصوص الافتراضية</button></section>
   <section class="card bar"><h2>نسخة احتياطية</h2><div class="btns"><button class="btn" data-act="export">تصدير نسخة</button><label class="btn">استيراد نسخة<input type="file" accept="application/json" id="imp" hidden></label></div></section>`;
 }
};
function render(){
  $('#chips').innerHTML=CLASSES.map(c=>`<button class="chip ${c===ui.cls?'on':''}" data-act="cls" data-v="${c}" role="tab" aria-selected="${c===ui.cls}">${c}<small>${D.students.filter(s=>s.cls===c).length}</small></button>`).join('');
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===ui.tab));
  $('#view').innerHTML=views[ui.tab]();
}

/* ---------- actions ---------- */
function violationResult(v){
  const n=lvlOf(v.sid,v.id),L=LEVELS[n-1],s=byId(v.sid);
  const msg=L.tpl?buildMsg(v.sid,L.tpl,{date:v.date,type:v.type}):'';
  openModal(`<div class="sheet l${n}" style="--lc:var(--l${n})"><h3>المخالفة ${ORD[n-1]}: ${esc(s.name)}</h3>
   <div><span class="badge l${n}">${L.name}</span></div><p style="margin:0">${L.act}</p>
   ${msg?`<div class="msg">${esc(msg)}</div>`:'<p class="hint">تم حفظ المخالفة في سجل الطالب.</p>'}
   <div class="btns noprint">${msg?`<button class="btn main" data-act="sendVio" data-id="${v.id}">إرسال الآن</button>`:''}${n>=3&&n<=5?`<button class="btn warn" data-act="pledge" data-id="${v.id}">نموذج التعهد</button>`:''}<button class="btn" data-act="qClose">إغلاق</button></div></div>`);
}
const act={
 tab(d){ui.tab=d.v;ui.del='';render();scrollTo(0,0)},
 cls(d){ui.cls=d.v;ui.del='';render()},
 setAtt(d){
  const day=D.attendance[ui.date]=D.attendance[ui.date]||{};
  if(day[d.id]===d.v)return;
  day[d.id]=d.v;save();
  if(d.v==='A'){sound('absent');try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}
    if(S().autoSend)sendMessage(d.id,'absent');else toast('سُجّل الغياب. اضغط إعادة إرسال لإبلاغ ولي الأمر.','إرسال',()=>sendMessage(d.id,'absent'))}
  else sound('present');
  render();
 },
 allP(){const day=D.attendance[ui.date]=D.attendance[ui.date]||{};stu().forEach(s=>day[s.id]='P');save();sound('present');render()},
 resend(d){sendMessage(d.id,'absent')},
 absQueue(){const day=D.attendance[ui.date]||{};openQueue(stu().filter(s=>day[s.id]==='A'&&!wasSent(s.id,'absent',ui.date)).map(s=>({sid:s.id,kind:'absent',x:{}})),'رسائل الغياب: '+ui.cls)},
 vioQueue(){
  const items=[];stu().forEach(s=>{const h=vlist(s.id);if(h.length<2)return;const v=h[h.length-1],n=Math.min(6,h.length);
    if(!wasSent(s.id,LEVELS[n-1].tpl,v.date,v.id))items.push({sid:s.id,kind:LEVELS[n-1].tpl,x:{date:v.date,type:v.type,vid:v.id}})});
  openQueue(items,'رسائل المخالفين: '+ui.cls)},
 qOne(d){qSend(+d.v)},
 qNext(){const k=ui.queue.items.findIndex(i=>!i.sent);if(k>=0)qSend(k)},
 async qAll(){for(let k=0;k<ui.queue.items.length;k++)await qSend(k)},
 qClose(){ui.queue=null;closeModal();render()},
 addVio(){
  const sid=$('#vS').value,date=$('#vD').value||todayISO();
  let type=$('#vT').value;const other=$('#vO').value.trim();if(other)type=type==='أخرى'?other:type+' ('+other+')';
  const v={id:uid(),sid,date,type,note:$('#vN').value.trim(),ts:Date.now()};
  D.violations.push(v);save();
  const n=lvlOf(sid,v.id);render();fx(n);
  setTimeout(()=>{violationResult(v);if(S().autoSend&&LEVELS[n-1].tpl)sendMessage(sid,LEVELS[n-1].tpl,{date,type,vid:v.id})},900+n*120);
 },
 sendVio(d){const v=D.violations.find(x=>x.id===d.id);if(!v)return;const n=lvlOf(v.sid,v.id);sendMessage(v.sid,LEVELS[n-1].tpl,{date:v.date,type:v.type,vid:v.id})},
 pledge(d){
  const v=D.violations.find(x=>x.id===d.id),s=byId(v.sid);
  openModal(`<div class="sheet" style="--lc:var(--board)"><h3 style="text-align:center">${SCHOOL}<br>تعهد ولي أمر طالب</h3>
   <p>أتعهد أنا ولي أمر الطالب <b>${esc(s.name)}</b> (${esc(s.cls)}) بمتابعة سلوك ابني والتزامه بأنظمة المدرسة وعدم تكرار المخالفات، وأدرك أن تكرارها يؤدي إلى الإنذار الأول ثم الإنذار النهائي ثم فصل الطالب من المدرسة.</p>
   <p>المخالفة: ${esc(v.type)} بتاريخ ${esc(v.date)}</p>
   <p>اسم ولي الأمر: ${esc(s.parent||'................')} &nbsp; التوقيع: ................ &nbsp; التاريخ: ................</p>
   <p>المعلم المشرف: عدي عصفور &nbsp; توقيع الإدارة: ................</p>
   <div class="btns noprint"><button class="btn main" data-act="doPrint">طباعة</button><button class="btn" data-act="qClose">إغلاق</button></div></div>`);
 },
 doPrint(){window.print()},
 toggle(d){ui.open[d.id]=!ui.open[d.id];render()},
 askDel(d){ui.del=d.id;render()},
 delVio(d){D.violations=D.violations.filter(v=>v.id!==d.id);ui.del='';save();render();toast('حُذفت المخالفة')},
 delStu(d){D.students=D.students.filter(s=>s.id!==d.id);D.violations=D.violations.filter(v=>v.sid!==d.id);ui.del='';save();render();toast('حُذف الطالب')},
 addStu(){
  const name=$('#nN').value.trim();if(!name){toast('اكتب اسم الطالب');return}
  D.students.push({id:uid(),cls:ui.cls,name,parent:$('#nP').value.trim(),phone:$('#nT').value.trim(),note:$('#nO').value.trim()});save();render();toast('أُضيف '+name);
 },
 rmEx(){const ids=D.students.filter(s=>(s.note||'').startsWith('مثال')).map(s=>s.id);D.students=D.students.filter(s=>!ids.includes(s.id));D.violations=D.violations.filter(v=>!ids.includes(v.sid));save();render()},
 editStu(d){
  const s=byId(d.id);
  openModal(`<div class="sheet" style="--lc:var(--board)"><h3>تعديل بيانات الطالب</h3>
   <div class="grid2"><label class="f">اسم الطالب<input type="text" id="eN" value="${esc(s.name)}"></label><label class="f">اسم ولي الأمر<input type="text" id="eP" value="${esc(s.parent)}"></label>
   <label class="f">رقم الهاتف<input type="tel" id="eT" value="${esc(s.phone)}"></label><label class="f">الصف<select id="eC">${CLASSES.map(c=>`<option ${c===s.cls?'selected':''}>${c}</option>`).join('')}</select></label></div>
   <label class="f">ملاحظة<input type="text" id="eO" value="${esc(s.note)}"></label>
   <div class="btns"><button class="btn main" data-act="saveStu" data-id="${s.id}">حفظ</button><button class="btn" data-act="qClose">إلغاء</button></div></div>`);
 },
 saveStu(d){const s=byId(d.id);s.name=$('#eN').value.trim()||s.name;s.parent=$('#eP').value.trim();s.phone=$('#eT').value.trim();s.cls=$('#eC').value;s.note=$('#eO').value.trim();save();closeModal();render()},
 syncNow(){syncNow(true)},pull(){pullSheet()},
 resetTpl(){S().tpl={...DEF_TPL};save();render()},
 export(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='sanjil-school-backup-'+todayISO()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
};
Object.assign(act,{
 impGo(){
  const I=ui.imp;if(!I)return;const P=planImport();let n=0,u=0;
  P.ok.forEach((x,i)=>{
    if(I.mode==='students'){
      if(x.upd){['name','parent','phone','note'].forEach(k=>{if(x.f[k])x.upd[k]=x.f[k]});u++}
      else{D.students.push({id:uid(),cls:x.cls,...x.f});n++}
    }else if(I.mode==='violations'){D.violations.push({id:uid(),sid:x.sid,date:x.date,type:x.type,note:x.note,ts:Date.now()+i});n++}
    else{(D.attendance[x.date]=D.attendance[x.date]||{})[x.sid]=x.st;n++}
  });
  save();closeModal();render();
  toast('تم الاستيراد: '+n+' جديد'+(u?'، وتحديث '+u:''));
 },
 tplXlsx(){
  loadXLSX().then(X=>{
    const wb=X.utils.book_new(),add=(n,rows)=>X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet(rows),n);
    add('طلاب',[['الصف','اسم الطالب','ولي الأمر','رقم الهاتف','ملاحظة'],['السادس أ','اسم الطالب هنا','اسم ولي الأمر','0599000000','مثال، احذف هذا السطر']]);
    add('مخالفات',[['الصف','اسم الطالب','نوع المخالفة','التاريخ','ملاحظة'],['السادس أ','اسم الطالب هنا','الإزعاج داخل الصف','2026-11-03','']]);
    add('حضور',[['الصف','اسم الطالب','التاريخ','الحالة'],['السادس أ','اسم الطالب هنا','2026-11-03','غائب']]);
    X.writeFile(wb,'school-import-template.xlsx');
  }).catch(()=>toast('تعذر تحميل القالب، تحتاج اتصالا بالإنترنت أول مرة'));
 }
});
document.addEventListener('click',e=>{
  if(e.target.id==='modal'&&!ui.queue&&!ui.imp){closeModal();return}
  const b=e.target.closest('[data-act]');if(b&&act[b.dataset.act])act[b.dataset.act](b.dataset,b)});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='impX'){impPickFile(t);return}
  if(t.dataset.imp){impChange(t);return}
  if(t.id==='imp'){const f=t.files[0];if(!f)return;f.text().then(x=>{try{const r=JSON.parse(x);if(!r.students)throw 0;D=r;D.settings={...defSet(),...(r.settings||{})};D.settings.tpl={...DEF_TPL,...D.settings.tpl};save();render();toast('تم استيراد النسخة')}catch(er){toast('ملف غير صالح')}});return}
  const k=t.dataset.bind;if(!k)return;
  if(k==='date'){ui.date=t.value||todayISO();render();return}
  if(k==='vs'){ui.vs=t.value;return}
  if(k.startsWith('tpl:')){S().tpl[k.slice(4)]=t.value;save();return}
  S()[k]=t.type==='checkbox'?t.checked:t.value.trim();save();
  if(k==='mode')render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!ui.queue&&!ui.imp)closeModal()});
render();setSync(S().sheetUrl?'جوجل شيت: مفعّل':'');
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
window.addEventListener('load',()=>{if(navigator.onLine&&location.protocol!=='file:')setTimeout(()=>loadXLSX().catch(()=>{}),4000)});
let installEv=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEv=e;toast('ثبّت البرنامج كتطبيق على جهازك','تثبيت',()=>installEv.prompt())});
})();
</script>
</body>
